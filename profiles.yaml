# elko-skills Profiles
# ============================================================
# Profiles provide parallel install isolation for dev/test/prod.
# Each profile can point skills at different source directories,
# different DB files, and different registry names.
#
# Switch profiles:
#   export ELKO_PROFILE=dev    # activates dev profile
#   unset ELKO_PROFILE          # back to default (prod)
#
# Example: install contacts under dev profile
#   ./install.sh contacts --profile dev
#   export ELKO_PROFILE=dev
#   python3 contacts/contacts.py    # uses /tmp/contacts.dev.db
#   unset ELKO_PROFILE
#   python3 contacts/contacts.py    # uses /opt/data/.../contacts.db
# ============================================================

profiles:

  # ── Production (default) ─────────────────────────────────
  # The main install. This is what runs in production.
  prod:
    skills:
      contacts:
        source: ~/.elko-skills/releases/v0.1.0/contacts
        db: /opt/data/elko-skills/contacts/contacts.db
        registry_name: hs-contacts
      threads:
        source: ~/.elko-skills/releases/v0.1.0/threads
        db: /opt/data/elko-skills/threads/threads.db
        registry_name: hs-threads

  # ── Development ──────────────────────────────────────────
  # Local checkout — point at your edited source.
  # Separate DB — doesn't touch production data.
  # Suffixed registry name — no registry conflict.
  dev:
    skills:
      contacts:
        source: /home/user/code/elko-skills/contacts
        db: /tmp/elko-contacts-dev.db
        registry_name: hs-contacts-dev
      threads:
        source: /home/user/code/elko-skills/threads
        db: /tmp/elko-threads-dev.db
        registry_name: hs-threads-dev

  # ── Testing ──────────────────────────────────────────────
  # For CI and automated test runs.
  # Ephemeral DBs in a temp directory.
  test:
    skills:
      contacts:
        db: /tmp/elko-contacts-test.db
        registry_name: hs-contacts-test
      threads:
        db: /tmp/elko-threads-test.db
        registry_name: hs-threads-test

# ── Active profile ────────────────────────────────────────
# Set this to 'dev' for development, 'test' for CI, 'prod' for production.
# Override via: export ELKO_PROFILE=dev
active_profile: prod
